# SIT223 7.3HD - Alertmanager configuration
#
# Routes by severity to a real webhook receiver (the alert-logger service), which
# records every delivery. Raising an alert and delivering one are different things:
# `docker logs robot-alert-logger` shows the dispatch actually arrived, which the
# Alertmanager UI on its own does not prove.
#
# Critical and warning are separated deliberately - they differ in how fast they
# are dispatched and how often they repeat, which is the whole point of routing.
# Substituting email, Slack or PagerDuty is a change of URL and nothing else.

global:
  resolve_timeout: 1m

route:
  receiver: 'default'
  group_by: ['alertname', 'environment']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - matchers:
        - severity = "critical"
      receiver: 'critical'
      group_wait: 5s
      repeat_interval: 2m

receivers:
  # send_resolved matters as much as the alert itself: an on-call engineer needs
  # to know the incident ended without going back to a dashboard to check.
  - name: 'default'
    webhook_configs:
      - url: 'http://robot-alert-logger:5001/alerts'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://robot-alert-logger:5001/alerts'
        send_resolved: true

inhibit_rules:
  # If production is down, don't also spam about its latency.
  - source_matchers:
      - alertname = "ProductionDown"
    target_matchers:
      - alertname = "HighResponseLatency"
    equal: ['environment']

# SIT223 7.3HD - Stage 7 monitoring stack
#
# Deliberately requires ZERO changes to RobotControllerApi. blackbox_exporter probes
# the app's existing /health endpoint from outside, which gives uptime AND latency
# without instrumenting the code. cAdvisor adds per-container CPU/memory/restart data.
#
# Ports: Prometheus 9090, Grafana 3000, Alertmanager 9093, blackbox 9115, cAdvisor 8093.
# None of these collide with Jenkins (8080), staging (8090), prod (8091) or test (8092).

name: robot-monitoring

services:

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: robot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: robot-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring

  # The receiving end of the alert path. Alertmanager routes here, this logs the
  # delivery, so `docker logs robot-alert-logger` proves an alert was actually
  # dispatched rather than only raised. See alert-logger.py for why.
  alert-logger:
    image: python:3.12-alpine
    container_name: robot-alert-logger
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./alert-logger.py:/app/alert-logger.py:ro
    command: ["python", "-u", "/app/alert-logger.py"]
    networks:
      - monitoring

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: robot-blackbox
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: robot-cadvisor
    restart: unless-stopped
    ports:
      - "8093:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: robot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  monitoring:
    name: robot-monitoring-net

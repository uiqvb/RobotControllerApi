<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Robot Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1118;--panel:#121a24;--panel2:#182230;--line:#243446;--text:#e6edf5;--dim:#8da3bc;--faint:#5b6f88;
--accent:#00d9ff;--ok:#34d399;--warn:#ffb020;--bad:#ff5470;--roll:#b388ff;--radius:10px}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:radial-gradient(1000px 520px at 80% -20%,rgba(0,217,255,.07),transparent 60%),var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px}
h1,h2,h3{font-family:'Chakra Petch',sans-serif;margin:0;letter-spacing:.06em}
h2{font-size:12px;text-transform:uppercase;color:var(--dim);letter-spacing:.16em;margin-bottom:8px}
h3{font-size:10px;text-transform:uppercase;color:var(--faint);letter-spacing:.14em;margin:12px 0 6px}
.mono{font-family:'JetBrains Mono',monospace}.tiny{font-size:11px}.muted{color:var(--dim)}.hidden{display:none!important}
.bar{display:flex;gap:12px;align-items:center;padding:10px 16px;background:rgba(11,17,24,.94);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;flex-wrap:wrap}
.brand{font-family:'Chakra Petch',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:9px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(0,217,255,.15)}
.spacer{flex:1}
label{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.13em;display:block;margin-bottom:3px}
select,input{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font-family:'JetBrains Mono',monospace;font-size:12px}
select:focus,input:focus{outline:0;border-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:6px 12px;font-size:12px}
.pill .led{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.pill.ok .led{background:var(--ok);box-shadow:0 0 10px var(--ok)}.pill.bad .led{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:12px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#001218;border-color:var(--accent);font-weight:700}
.btn.roll{color:var(--roll);border-color:rgba(179,136,255,.45)}.btn.danger{color:var(--bad);border-color:rgba(255,84,112,.45)}
.btn.sm{padding:5px 9px;font-size:11px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px 16px 8px}
@media(max-width:1080px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 15px}
.canvas{background:#07101a;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:66vh}
.maprow{display:flex}.axis{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:9px;display:flex;align-items:center;justify-content:center;min-width:18px}
.cells{display:grid;gap:1px;flex:1;min-width:0}
.cell{position:relative;aspect-ratio:1/1;background:var(--panel2);border-radius:2px;min-width:13px}
.cell.alt{background:#101b28}
.tr{position:absolute;inset:26%;border-radius:50%;background:var(--accent);opacity:.5}.tr.rb{background:var(--roll);opacity:.85}
.bot{position:absolute;inset:-8%;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#001218;background:var(--accent);box-shadow:0 0 12px rgba(0,217,255,.6);z-index:2;transition:all .25s ease}
.bot.untrusted{background:transparent;border:2px dashed var(--accent);color:var(--accent);box-shadow:none}
.bot.offline{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.rail{display:flex;flex-direction:column;gap:12px}
.botcard{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:11px}
.botcard.off{border-left-color:var(--bad)}
.pos{font-family:'JetBrains Mono',monospace;font-size:15px;margin:6px 0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{display:inline-block;border-radius:4px;padding:2px 7px;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.07em;font-size:10px}
.chip.on{background:rgba(52,211,153,.16);color:var(--ok)}.chip.offc{background:rgba(255,84,112,.16);color:var(--bad)}
.chip.warnc{background:rgba(255,176,32,.16);color:var(--warn)}.chip.dimc{background:rgba(141,163,188,.14);color:var(--dim)}
.seq{display:flex;gap:5px;flex-wrap:wrap;min-height:34px;background:#07101a;border:1px solid var(--line);border-radius:6px;padding:7px}
.tok{font-family:'JetBrains Mono',monospace;font-size:11px;background:rgba(0,217,255,.12);color:var(--accent);border:1px solid rgba(0,217,255,.25);padding:3px 7px;border-radius:999px;cursor:pointer}
.tok:hover{background:rgba(255,84,112,.15);color:var(--bad);border-color:var(--bad)}
.trail{max-height:170px;overflow:auto;font-family:'JetBrains Mono',monospace;font-size:11px}
.trail div{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
.trail .rb{color:var(--roll)}
.dock{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);margin-top:6px}
.dpad{display:grid;grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,44px);gap:5px}
.dpad button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);cursor:pointer;font-size:16px}
.dpad button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.dpad .u{grid-column:2}.dpad .l{grid-column:1;grid-row:2}.dpad .c{grid-column:2;grid-row:2;background:var(--bad);border-color:var(--bad);color:#fff;font-size:12px}
.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.drawer{border-top:1px solid var(--line);background:var(--panel)}
.drawer summary{cursor:pointer;padding:10px 16px;font-family:'Chakra Petch',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--dim)}
.drawer .inner{padding:0 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.drawer .inner{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:6px 5px;border-bottom:1px solid var(--line);color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.12em}
td{padding:5px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace}
.tw{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.log{background:#07101a;border:1px solid var(--line);border-radius:6px;color:#6ed4ff;font-family:'JetBrains Mono',monospace;font-size:11px;max-height:230px;overflow:auto;padding:9px;white-space:pre-wrap}
.toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:9px 12px;font-size:12px;max-width:340px}
.toast.ok{border-left-color:var(--ok)}.toast.error{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.banner{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--panel2);border-radius:6px;padding:8px 10px;color:var(--warn);font-size:12px;margin-top:8px}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><span class="dot"></span> Robot Controller</div>
  <div><label>Robot</label><select id="deviceSel" style="min-width:190px"></select></div>
  <div><label>Map</label><select id="mapSel" style="min-width:200px"></select></div>
  <button class="btn sm" id="assignBtn" title="Assign the selected map to this robot">Assign</button>
  <button class="btn sm" id="unassignBtn" title="Detach this robot from its map">Unassign</button>
  <div class="spacer"></div>
  <div class="pill" id="pill"><span class="led"></span><span id="pillText">Connecting</span></div>
  <button class="btn sm" id="liveBtn">Live: ON</button>
  <details style="position:relative">
    <summary class="btn sm" style="list-style:none">Login</summary>
    <div class="card" style="position:absolute;right:0;top:36px;z-index:60;width:250px">
      <label>Email</label><input id="email" style="width:100%">
      <label style="margin-top:7px">Password</label><input id="password" type="password" style="width:100%">
      <button class="btn primary sm" id="saveBtn" style="margin-top:9px;width:100%">Save &amp; Connect</button>
    </div>
  </details>
</div>

<main>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px">
      <h2 id="mapTitle" style="margin:0">Map</h2>
      <span class="tiny muted" id="mapMeta"></span>
    </div>
    <div class="canvas" id="canvas"><span class="muted tiny">Loading...</span></div>
    <div class="tiny muted" style="margin-top:6px">Origin (0,0) bottom-left. y increases upward, matching MOVE while facing North.</div>
  </div>

  <div class="rail">
    <div class="card">
      <h2>Robot</h2>
      <div id="botCard"><span class="muted tiny">No robot selected.</span></div>
    </div>

    <div class="card">
      <h2>Workflow</h2>
      <div class="chips" style="margin-bottom:7px">
        <button class="btn sm" data-add="MOVE">Move</button>
        <button class="btn sm" data-add="LEFT">Left</button>
        <button class="btn sm" data-add="RIGHT">Right</button>
        <button class="btn sm" data-add="STEP_BACK">Back</button>
      </div>
      <div class="seq" id="seq"></div>
      <label style="margin-top:9px">Failure policy</label>
      <select id="wfMode" style="width:100%">
        <option value="AllOrNothing">AllOrNothing - dry-run first, abort all if one step fails</option>
        <option value="BestEffort">BestEffort - skip a failed step, keep going</option>
      </select>
      <div style="display:flex;gap:7px;margin-top:9px">
        <button class="btn primary" id="runWf" style="flex:1">Run</button>
        <button class="btn sm" id="clearWf">Clear</button>
      </div>
    </div>

    <div class="card">
      <h2>Trail</h2>
      <div class="trail" id="trail"></div>
      <button class="btn roll sm" id="rollbackBtn" style="width:100%;margin-top:9px">Roll back last workflow</button>
    </div>
  </div>
</main>

<div class="dock">
  <div>
    <label>Place robot at</label>
    <div style="display:flex;gap:5px;align-items:center">
      <input id="px" type="number" value="0" style="width:60px" title="Grid X">
      <input id="py" type="number" value="0" style="width:60px" title="Grid Y">
      <select id="pf"><option>North</option><option>East</option><option>South</option><option>West</option></select>
      <button class="btn primary" id="placeBtn">PLACE</button>
    </div>
  </div>
  <div>
    <label>Single grid command</label>
    <div style="display:flex;gap:5px">
      <button class="btn" data-job="LEFT">&#9664; Left</button>
      <button class="btn" data-job="MOVE">&#9650; Move</button>
      <button class="btn" data-job="RIGHT">Right &#9654;</button>
      <button class="btn" data-job="STEP_BACK">&#9660; Back</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div>
    <label>Live drive - hold, or W A S D</label>
    <div class="dpad">
      <button class="u live" data-live="MOVE_FORWARD">&#9650;</button>
      <button class="l live" data-live="ROTATE_LEFT">&#9664;</button>
      <button class="c" id="liveStop">STOP</button>
      <button class="r live" data-live="ROTATE_RIGHT">&#9654;</button>
      <button class="d live" data-live="MOVE_BACKWARD">&#9660;</button>
    </div>
  </div>
</div>

<details class="drawer">
  <summary>History &amp; log</summary>
  <div class="inner">
    <div>
      <h3>Workflows</h3>
      <div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Mode</th><th>Status</th><th></th></tr></thead><tbody id="wfBody"></tbody></table></div>
      <h3>Jobs</h3>
      <div class="tw"><table><thead><tr><th>ID</th><th>Cmd</th><th>Status</th><th>WF</th><th></th></tr></thead><tbody id="jobBody"></tbody></table></div>
    </div>
    <div>
      <h3>Event log</h3>
      <div class="log" id="log"></div>
      <button class="btn sm" id="clearLog" style="margin-top:7px">Clear log</button>
    </div>
  </div>
</details>

<div class="toasts" id="toasts"></div>

<script>
const LIVE_CMDS = ['MOVE_FORWARD','MOVE_BACKWARD','ROTATE_LEFT','ROTATE_RIGHT'];
const ACTIVE = ['Queued','Claimed','Executing'];
const ARROW = {North:'▲', East:'▶', South:'▼', West:'◀'};
const POLL_MS = 1000;
// A robot counts as live if it called the API within this window. Taken from device-credential
// lastUsedAtUtc, which moves on EVERY poll. DeviceStatus.lastSeenAtUtc only moves when a job
// completes, so an idle but perfectly healthy robot would look dead.
const OFFLINE_MS = 15000;

const state = {
  email: localStorage.getItem('rcEmail') || 'manit@test.com',
  password: localStorage.getItem('rcPassword') || '',
  deviceId: parseInt(localStorage.getItem('rcDeviceId') || '1', 10),
  devices: [], maps: [], statuses: [], creds: [], catalogue: [], caps: new Set(),
  jobs: [], workflows: [], jobHistory: [],
  byName: new Map(), byId: new Map(),
  seq: [], live: true, timer: null,
  liveSessionId: null, liveInterval: null, liveCommand: null, liveSeq: 1, keys: new Set()
};

const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
function log(m,k){const t=new Date().toLocaleTimeString(); $('#log').textContent=`[${t}] ${m}\n`+$('#log').textContent; (k==='error'?console.error:console.log)(m)}
function toast(m,k,ms){const e=document.createElement('div'); e.className='toast '+(k||''); e.textContent=m; $('#toasts').appendChild(e); setTimeout(()=>e.remove(),ms||3200)}
function pill(k,t){$('#pill').className='pill '+(k||''); $('#pillText').textContent=t}
function authHeader(){return 'Basic ' + btoa(state.email.trim() + ':' + state.password)}
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({Accept:'application/json','X-Requested-With':'XMLHttpRequest'}, opts.headers||{}, {Authorization:authHeader()});
  if(opts.body && !opts.headers['Content-Type']) opts.headers['Content-Type']='application/json';
  const res = await fetch(path, Object.assign({cache:'no-store',credentials:'same-origin'}, opts));
  const text = await res.text(); let data=null; try{data=text?JSON.parse(text):null}catch(e){data=text}
  if(!res.ok){const err=new Error(res.status+': '+(typeof data==='string'?data:JSON.stringify(data))); err.status=res.status; throw err}
  return data;
}
function norm(x){return String(x||'').trim().toUpperCase().replace(/-/g,'_')}
function cmdId(n){const c=state.byName.get(norm(n)); if(!c) throw new Error('Command not in catalogue: '+n); return c.id}
function cmdName(id){const c=state.byId.get(id); return c?c.name:('#'+id)}
function hasCap(n){return state.caps.has(norm(n))}
// Timestamps arrive without a zone but are UTC. Parsed as-is the browser treats them as local,
// which on a UTC+10 machine makes every robot look 10h stale and permanently offline.
function parseUtc(s){if(!s) return null; const t=/[zZ]|[+-]\d{2}:?\d{2}$/.test(s)?s:s+'Z'; const d=new Date(t); return isNaN(d)?null:d}
function ago(d){if(!d) return 'never'; const ms=Date.now()-d.getTime(); if(ms<0) return 'now'; if(ms<60000) return Math.round(ms/1000)+'s ago'; if(ms<3600000) return Math.round(ms/60000)+'m ago'; return Math.round(ms/3600000)+'h ago'}
function save(){state.email=$('#email').value.trim(); state.password=$('#password').value; localStorage.setItem('rcEmail',state.email); localStorage.setItem('rcPassword',state.password); localStorage.setItem('rcDeviceId',String(state.deviceId))}

async function loadRef(){
  const r = await Promise.all([api('/api/devices'), api('/api/command-catalogue'), api('/api/maps')]);
  // Deactivated devices are hidden: they cannot be dispatched work, so listing them would only
  // invite queueing commands that can never run.
  state.devices = (r[0]||[]).filter(d => d.isActive !== false);
  state.catalogue = r[1]||[];
  state.maps = (r[2]||[]).filter(m => m.isActive !== false);
  state.byName=new Map(); state.byId=new Map();
  state.catalogue.forEach(c=>{state.byName.set(norm(c.name),c); state.byId.set(c.id,c)});
  if(!state.devices.some(d=>d.id===state.deviceId) && state.devices.length) state.deviceId=state.devices[0].id;
}
async function refresh(){
  save();
  try{
    if(!state.catalogue.length) await loadRef();
    const r = await Promise.all([
      api('/api/devices/'+state.deviceId+'/capabilities').catch(()=>[]),
      api('/api/device-status').catch(()=>[]),
      api('/api/device-credentials').catch(()=>[]),
      api('/api/devices/'+state.deviceId+'/jobs').catch(()=>[]),
      api('/api/devices/'+state.deviceId+'/workflows').catch(()=>[]),
      api('/api/devices/'+state.deviceId+'/job-history').catch(()=>[])
    ]);
    state.caps=new Set(); (r[0]||[]).filter(c=>c.isActive!==false).forEach(c=>state.caps.add(norm(cmdName(c.commandCatalogueId))));
    state.statuses=r[1]||[]; state.creds=r[2]||[]; state.jobs=r[3]||[]; state.workflows=r[4]||[]; state.jobHistory=r[5]||[];
    pill('ok','Connected');
    render();
  }catch(e){ pill('bad', e.status===401?'Auth failed':'Error'); log('Refresh failed: '+e.message,'error') }
}
function myStatus(){return state.statuses.find(s=>s.deviceId===state.deviceId) || {}}
function myDevice(){return state.devices.find(d=>d.id===state.deviceId) || {}}
function currentMap(){const id = myStatus().poseMapId || myDevice().mapId; return state.maps.find(m=>m.id===id) || null}
function lastContact(id){const t=state.creds.filter(c=>c.deviceId===id).map(c=>parseUtc(c.lastUsedAtUtc)).filter(Boolean); return t.length?new Date(Math.max.apply(null,t.map(x=>x.getTime()))):null}
function isOffline(id){const c=lastContact(id); return !c || (Date.now()-c.getTime())>OFFLINE_MS}

// Rebuilds the path walked since the last PLACE. History records the command, not the
// resulting cell, so the route has to be replayed with the same rules the backend applies.
function buildTrail(){
  const rows=(state.jobHistory||[]).filter(h=>h.executed&&h.success).slice().sort((a,b)=>new Date(a.createdDate)-new Date(b.createdDate));
  let start=-1, pose=null;
  rows.forEach((h,i)=>{ if(norm(h.commandName)==='PLACE'){ try{const p=JSON.parse(h.payloadJson||'{}'); if(p.gridX!=null&&p.gridY!=null){start=i; pose={x:+p.gridX,y:+p.gridY,f:p.facing||'North'}}}catch(e){} } });
  if(start<0||!pose) return [];
  const st=new Map((state.jobs||[]).map(j=>[j.id,j.status]));
  const L={North:'West',West:'South',South:'East',East:'North'}, R={North:'East',East:'South',South:'West',West:'North'};
  const out=[];
  for(let i=start+1;i<rows.length;i++){
    const h=rows[i], c=norm(h.commandName), from={x:pose.x,y:pose.y,f:pose.f};
    if(c==='PLACE') break;
    if(c==='LEFT') pose.f=L[pose.f]; else if(c==='RIGHT') pose.f=R[pose.f];
    else if(c==='MOVE'||c==='STEP_BACK'){const s=c==='MOVE'?1:-1; if(pose.f==='North')pose.y+=s; else if(pose.f==='South')pose.y-=s; else if(pose.f==='East')pose.x+=s; else pose.x-=s}
    else continue;
    out.push({c:c,from:from,to:{x:pose.x,y:pose.y,f:pose.f},rb:st.get(h.jobId)==='RolledBack'});
  }
  return out;
}

function renderSelectors(){
  const ds=$('#deviceSel'); ds.innerHTML='';
  state.devices.forEach(d=>{const o=document.createElement('option'); o.value=d.id; o.textContent='#'+d.id+' '+(d.name||d.deviceIdentifier); ds.appendChild(o)});
  ds.value=String(state.deviceId);
  // One map per robot: device.mapId is a single column, so a robot holds at most one. The list
  // shows every active map; Assign commits the selection. Selection alone must NOT assign -
  // when nothing is assigned the dropdown would already be sitting on the first map, so
  // choosing it fires no change event and the robot could never be assigned at all.
  const ms=$('#mapSel'); const assigned=myDevice().mapId;
  const keep = ms.value;                       // preserve what the user picked across re-renders
  ms.innerHTML='';
  if(!state.maps.length){
    const o=document.createElement('option'); o.textContent='No maps'; ms.appendChild(o);
    $('#assignBtn').disabled=true; $('#unassignBtn').disabled=true; return;
  }
  // An explicit "not assigned" row so the unassigned state is visible rather than implied by
  // the dropdown happening to show some unrelated map.
  const none=document.createElement('option'); none.value=''; none.textContent='- not assigned -'; ms.appendChild(none);
  state.maps.forEach(m=>{
    const o=document.createElement('option'); o.value=m.id;
    o.textContent=m.name+' '+m.columns+'x'+m.rows+(m.id===assigned?' (assigned)':'');
    ms.appendChild(o);
  });
  // Restore the pending selection if it is still valid, otherwise fall back to what is assigned.
  ms.value = (keep && state.maps.some(m=>String(m.id)===keep)) ? keep : (assigned ? String(assigned) : '');
  const sel = parseInt(ms.value,10);
  $('#assignBtn').disabled = !sel || sel===assigned;
  $('#unassignBtn').disabled = !assigned;
}
function render(){ renderSelectors(); renderMap(); renderBot(); renderTrail(); renderTables(); renderCaps() }
function renderCaps(){
  const ok = LIVE_CMDS.every(hasCap);
  $$('.dpad .live').forEach(b=>b.disabled=!ok);
  $$('[data-job]').forEach(b=>b.disabled=!hasCap(b.dataset.job));
}
function renderMap(){
  const m=currentMap(), c=$('#canvas');
  if(!m){ c.innerHTML='<span class="muted tiny">No map assigned to this robot. Choose one above.</span>'; $('#mapTitle').textContent='Map'; $('#mapMeta').textContent=''; return }
  $('#mapTitle').textContent=m.name;
  $('#mapMeta').textContent=m.columns+' x '+m.rows+' cells - '+m.cellSizeCm+'cm/cell - map #'+m.id;
  const trail=buildTrail(), tc=new Map();
  trail.forEach(t=>{const k=t.to.x+','+t.to.y; if(!tc.has(k)||t.rb) tc.set(k,t.rb)});
  const bots=state.statuses.filter(s=>s.poseMapId===m.id && s.gridX!=null && s.gridY!=null && state.devices.some(d=>d.id===s.deviceId));
  const cols='grid-template-columns:repeat('+m.columns+',minmax(13px,1fr))';
  const h=[];
  // y descends so row 0 renders at the bottom: the backend increments y when moving North, and
  // drawing top-down would mirror the map against what the robot physically does.
  for(let y=m.rows-1;y>=0;y--){
    h.push('<div class="maprow"><div class="axis">'+y+'</div><div class="cells" style="'+cols+'">');
    for(let x=0;x<m.columns;x++){
      const k=x+','+y; let inner='';
      const here=bots.filter(b=>b.gridX===x&&b.gridY===y);
      if(tc.has(k)&&!here.length) inner+='<div class="tr'+(tc.get(k)?' rb':'')+'"></div>';
      here.forEach(b=>{
        const d=state.devices.find(z=>z.id===b.deviceId)||{};
        const cls=['bot', b.isGridPoseTrusted?'':'untrusted', isOffline(b.deviceId)?'offline':''].filter(Boolean).join(' ');
        inner+='<div class="'+cls+'" title="'+((d.name||('Device '+b.deviceId))+' ('+x+','+y+') '+(b.facing||''))+'">'+(ARROW[b.facing]||'●')+'</div>';
      });
      h.push('<div class="cell'+((x+y)%2?' alt':'')+'">'+inner+'</div>');
    }
    h.push('</div></div>');
  }
  c.innerHTML=h.join('');
}
function renderBot(){
  const d=myDevice(), s=myStatus(), off=isOffline(d.id), placed=s.gridX!=null&&s.gridY!=null;
  const q=(state.jobs||[]).filter(j=>ACTIVE.indexOf(j.status)>=0).length;
  $('#botCard').innerHTML='<div class="botcard '+(off?'off':'')+'">'
    + '<div style="font-family:\'Chakra Petch\',sans-serif;letter-spacing:.06em">'+(d.name||'Robot')+' <span class="muted tiny">#'+(d.id||'')+'</span></div>'
    + '<div class="pos">'+(placed?('('+s.gridX+', '+s.gridY+') facing '+s.facing):'<span class="muted">not placed</span>')+'</div>'
    + '<div class="chips">'
      + '<span class="chip '+(off?'offc':'on')+'">'+(off?'offline':'online')+'</span>'
      + '<span class="chip '+(s.isGridPoseTrusted?'on':'warnc')+'">'+(s.isGridPoseTrusted?'trusted':'untrusted')+'</span>'
      + '<span class="chip '+(q>=3?'offc':'dimc')+'">queue '+q+'/3</span>'
    + '</div>'
    + '<div class="tiny muted" style="margin-top:7px">last contact '+ago(lastContact(d.id))+'</div>'
    + (s.isGridPoseTrusted?'':'<div class="banner">Pose untrusted - PLACE the robot before grid commands.</div>')
    + '</div>';
}
function renderTrail(){
  const t=buildTrail();
  $('#trail').innerHTML = t.length
    ? t.slice(-16).reverse().map(x=>'<div class="'+(x.rb?'↩':'✓')+'"><span>'+x.c+'</span><span>'
        + (x.c==='LEFT'||x.c==='RIGHT' ? (x.from.f+' &rarr; '+x.to.f) : ('('+x.from.x+','+x.from.y+') &rarr; ('+x.to.x+','+x.to.y+')'))
        + ' ' + (x.rb?'↩':'✓') + '</span></div>').join('')
    : '<span class="muted tiny">No trail yet. PLACE the robot, then run commands.</span>';
}
function renderTables(){
  // Cancel is only offered while work is still pending. Completed/Failed/Cancelled work cannot
  // be cancelled - the backend rejects it - so showing the button would just produce errors.
  $('#wfBody').innerHTML=(state.workflows||[]).slice().reverse().slice(0,25).map(function(w){
    var act='';
    if(ACTIVE.indexOf(w.status)>=0) act='<button class="btn sm danger" onclick="cancelWorkflow('+w.id+')">Cancel</button>';
    else if(w.status==='Completed') act='<button class="btn sm roll" onclick="rollbackWorkflow('+w.id+')">Undo</button>';
    return '<tr><td>'+w.id+'</td><td>'+(w.name||'')+'</td><td>'+w.executionMode+'</td><td>'+w.status+'</td><td>'+act+'</td></tr>';
  }).join('');
  $('#jobBody').innerHTML=(state.jobs||[]).slice().reverse().slice(0,40).map(function(j){
    var act = ACTIVE.indexOf(j.status)>=0 ? '<button class="btn sm danger" onclick="cancelJob('+j.id+')">Cancel</button>' : '';
    return '<tr><td>'+j.id+'</td><td>'+cmdName(j.commandCatalogueId)+'</td><td>'+j.status+'</td><td>'+(j.workflowId||'')+'</td><td>'+act+'</td></tr>';
  }).join('');
}
function renderSeq(){
  $('#seq').innerHTML = state.seq.length
    ? state.seq.map((c,i)=>'<span class="tok" onclick="removeStep('+i+')" title="Click to remove">'+(i+1)+'. '+c+'</span>').join('')
    : '<span class="muted tiny">Tap commands above to build a sequence.</span>';
}
function removeStep(i){state.seq.splice(i,1); renderSeq()}

async function queueJob(name, payload){
  try{
    const r=await api('/api/devices/'+state.deviceId+'/jobs',{method:'POST',body:JSON.stringify({commandCatalogueId:cmdId(name),payloadJson:payload||'{}',providerType:'Api'})});
    toast(name+' queued (job '+r.id+')','ok'); log(name+' queued as job '+r.id); refresh();
  }catch(e){ toast(e.message,'error'); log(e.message,'error') }
}
async function runWorkflow(){
  if(!state.seq.length) return toast('Add some commands first.','warn');
  const mode=$('#wfMode').value;
  try{
    const steps=state.seq.map((c,i)=>({stepNumber:i+1,commandCatalogueId:cmdId(c),payloadJson:'{}'}));
    const r=await api('/api/devices/'+state.deviceId+'/workflows',{method:'POST',body:JSON.stringify({name:'Console workflow',schemaVersion:'1.0',executionMode:mode,providerType:'Api',steps:steps})});
    toast('Workflow '+r.id+' queued ('+mode+')','ok'); log('Workflow '+r.id+' queued: '+state.seq.join(' ')+' ['+mode+']');
    state.seq=[]; renderSeq(); refresh();
  }catch(e){ toast(e.message,'error'); log(e.message,'error') }
}
async function cancelJob(id){
  try{ await api('/api/jobs/'+id+'/cancel',{method:'PATCH'}); toast('Job '+id+' cancelled','ok'); log('Job '+id+' cancelled'); refresh() }
  catch(e){ toast(e.message,'error'); log(e.message,'error') }
}
async function cancelWorkflow(id){
  try{ await api('/api/workflows/'+id+'/cancel',{method:'PATCH'}); toast('Workflow '+id+' cancelled','ok'); log('Workflow '+id+' cancelled'); refresh() }
  catch(e){ toast(e.message,'error'); log(e.message,'error') }
}
async function rollbackWorkflow(id){
  try{
    const r=await api('/api/workflows/'+id+'/rollback',{method:'POST',body:JSON.stringify({deviceId:state.deviceId,requestedByProvider:'Api',workflowHistoryIds:[],allowDuplicate:false})});
    toast(r.message||'Rollback generated','ok'); log('Rollback: '+(r.message||'generated')); refresh();
  }catch(e){ toast(e.message,'error'); log(e.message,'error') }
}
function rollbackLast(){
  const done=(state.workflows||[]).filter(w=>w.status==='Completed');
  if(!done.length) return toast('No completed workflow to roll back.','warn');
  rollbackWorkflow(done[done.length-1].id);
}
async function assignMap(mapId){
  try{ await api('/api/devices/'+state.deviceId+'/assign-map',{method:'PATCH',body:JSON.stringify({mapId:mapId})});
    toast('Map assigned','ok'); log('Map '+mapId+' assigned to device '+state.deviceId); await loadRef(); refresh();
  }catch(e){ toast(e.message,'error'); log(e.message,'error') }
}
async function unassignMap(){
  try{ await api('/api/devices/'+state.deviceId+'/unassign-map',{method:'PATCH'});
    toast('Map unassigned','ok'); await loadRef(); refresh();
  }catch(e){ toast(e.message,'error'); log(e.message,'error') }
}

/* live drive - ported unchanged from the previous console */
async function startLiveSession(){ if(state.liveSessionId) return state.liveSessionId; const s=await api('/api/devices/'+state.deviceId+'/live-control-sessions/start',{method:'POST',body:'{}'}); state.liveSessionId=s.id; return s.id }
// LIVE_REFRESH_MS: how often a held key is re-sent. LIVE_EXPIRES_MS: how long the robot should
// keep moving on one command if the refreshes stop. Keep the expiry at roughly 3x the refresh -
// too tight and the motors stutter between refreshes, too loose and a dead browser leaves the
// robot driving. The firmware's LIVE_CONTROL_STALE_MS fallback is kept at the same value.
const LIVE_REFRESH_MS=150, LIVE_EXPIRES_MS=450;
async function sendLive(cmd){ cmd=norm(cmd); const sid=await startLiveSession(); return api('/api/devices/'+state.deviceId+'/live-control-command',{method:'PUT',body:JSON.stringify({liveControlSessionId:sid,commandName:cmd,payloadJson:'{}',sequenceNumber:state.liveSeq++,expiresInMs:LIVE_EXPIRES_MS})}) }
function stopLiveInterval(){ if(state.liveInterval) clearInterval(state.liveInterval); state.liveInterval=null; state.liveCommand=null }
async function startLiveHold(cmd){
  if(!LIVE_CMDS.every(hasCap)) return toast('This robot has no live-control capability.','warn');
  if(state.liveCommand===cmd && state.liveInterval) return;
  stopLiveInterval();
  try{ state.liveCommand=cmd; await sendLive(cmd);
    state.liveInterval=setInterval(function(){ sendLive(cmd).catch(function(e){ log('Live refresh failed: '+e.message,'error'); stopLive() }) },LIVE_REFRESH_MS);
  }catch(e){ toast(e.message,'error'); stopLiveInterval() }
}
async function stopLive(){
  stopLiveInterval();
  try{ if(state.liveSessionId) await sendLive('STOP') }catch(e){ log('Live STOP failed: '+e.message,'error') }
  if(state.liveSessionId){ const sid=state.liveSessionId; state.liveSessionId=null;
    try{ await api('/api/devices/'+state.deviceId+'/live-control-sessions/'+sid+'/stop',{method:'POST',body:JSON.stringify({stopReason:'UserStopped'})}) }catch(e){ log('Stop session failed: '+e.message,'error') } }
  refresh();
}

$('#email').value=state.email; $('#password').value=state.password;
$('#saveBtn').onclick=function(){ save(); loadRef().then(refresh) };
$('#deviceSel').onchange=function(e){ state.deviceId=parseInt(e.target.value,10); save(); refresh() };
// Selecting only enables the button - it does not assign. Committing is an explicit click.
$('#mapSel').onchange=function(e){
  const id=parseInt(e.target.value,10);
  $('#assignBtn').disabled = !id || id===myDevice().mapId;
};
$('#assignBtn').onclick=function(){
  const id=parseInt($('#mapSel').value,10);
  if(!id) return toast('Pick a map first.','warn');
  assignMap(id);
};
$('#unassignBtn').onclick=unassignMap;
$('#clearLog').onclick=function(){ $('#log').textContent='' };
$$('[data-add]').forEach(function(b){ b.onclick=function(){ state.seq.push(b.dataset.add); renderSeq() } });
$('#clearWf').onclick=function(){ state.seq=[]; renderSeq() };
$('#runWf').onclick=runWorkflow;
$('#rollbackBtn').onclick=rollbackLast;
$$('[data-job]').forEach(function(b){ b.onclick=function(){ queueJob(b.dataset.job) } });
$('#placeBtn').onclick=function(){
  queueJob('PLACE', JSON.stringify({gridX:+$('#px').value, gridY:+$('#py').value, facing:$('#pf').value, poseMapId: myDevice().mapId || myStatus().poseMapId}));
};
$$('.dpad .live').forEach(function(b){
  const c=b.dataset.live;
  b.addEventListener('mousedown',function(e){ e.preventDefault(); startLiveHold(c) });
  b.addEventListener('touchstart',function(e){ e.preventDefault(); startLiveHold(c) },{passive:false});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){ b.addEventListener(ev,function(e){ e.preventDefault(); stopLive() }) });
});
$('#liveStop').onclick=stopLive;
document.addEventListener('keydown',function(e){
  if(e.repeat || ['INPUT','TEXTAREA','SELECT'].indexOf(e.target.tagName)>=0) return;
  const m={w:'MOVE_FORWARD',arrowup:'MOVE_FORWARD',s:'MOVE_BACKWARD',arrowdown:'MOVE_BACKWARD',a:'ROTATE_LEFT',arrowleft:'ROTATE_LEFT',d:'ROTATE_RIGHT',arrowright:'ROTATE_RIGHT'};
  const k=e.key.toLowerCase();
  if(k===' '){ e.preventDefault(); stopLive(); return }
  if(m[k]){ e.preventDefault(); state.keys.add(k); startLiveHold(m[k]) }
});
document.addEventListener('keyup',function(e){ const k=e.key.toLowerCase(); if(!state.keys.has(k)) return; state.keys.delete(k); if(!state.keys.size) stopLive() });
function setLive(on){
  state.live=on; $('#liveBtn').textContent='Live: '+(on?'ON':'OFF'); $('#liveBtn').classList.toggle('primary',on);
  if(state.timer){ clearInterval(state.timer); state.timer=null }
  if(on) state.timer=setInterval(function(){ refresh().catch(function(){}) }, POLL_MS);
}
$('#liveBtn').onclick=function(){ setLive(!state.live) };
renderSeq(); setLive(true); refresh();
</script>
</body>
